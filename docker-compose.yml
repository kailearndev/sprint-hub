services:
  postgres:
    image: postgres:16-alpine
    container_name: ${APP_NAME}-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ${APP_NAME}-redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"

volumes:
  postgres_data:
